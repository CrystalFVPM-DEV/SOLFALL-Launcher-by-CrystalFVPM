# Release del Solfall Launcher (Windows, Tauri v2) -> GitHub Releases
# Repo: CrystalFVPM-DEV/SOLFALL-Launcher-by-CrystalFVPM
# Endpoint del updater (fijo en src-tauri/tauri.conf.json):
#   https://github.com/CrystalFVPM-DEV/SOLFALL-Launcher-by-CrystalFVPM/releases/latest/download/latest.json
#
# SUPUESTOS (escrito por Backend el 13-11-2026, hora de Chile, UTC-3; actualizado en fase 4 el 13-11-2026
# antes del cierre del staging; la versión la decide Engine en src-tauri/tauri.conf.json — este workflow es
# agnóstico a 0.2.1 / 0.2.2 / cualquiera: falla si el tag no coincide, no reescribe la versión):
#   - src-tauri/ en la raíz del repo; frontend estático en src/ sin paso de build.
#   - npm + package-lock.json; @tauri-apps/cli 2.12.4 en devDependencies -> `npm ci` y `npx tauri build`.
#   - Build nativo en windows-latest (sin cargo-xwin, sin --target) -> artefactos en src-tauri/target/release/bundle/nsis/.
#   - productName exactamente "SolfallLauncher" -> el único instalador admitido es
#     SolfallLauncher_X.Y.Z_x64-setup.exe (y su .sig). Cualquier otro nombre falla.
#   - bundle.createUpdaterArtifacts = true (boolean). NO usar "v1Compatible": genera un .nsis.zip que este
#     workflow no sube y no debe aparecer en el release.
#   - plugins.updater.pubkey = clave PÚBLICA de producción, key ID minisign D78F00A86CB044C7, embebida por
#     Engine con set-pubkey. La TEST-ONLY se rechaza.
#   - WebView2: Engine usa bundle.windows.webviewInstallMode = embedBootstrapper. Este workflow es agnóstico
#     al modo: no comprueba ni depende de rutas o artefactos de downloadBootstrapper, offlineInstaller o
#     fixedRuntime; el instalador NSIS sigue siendo SolfallLauncher_X.Y.Z_x64-setup.exe en todos los modos.
#   - La versión la decide Engine en src-tauri/tauri.conf.json; este workflow NO la reescribe: falla si el tag no coincide.
#
# Assets del release (exactamente 3, nada más: ni zips, ni README, ni .nsis.zip):
#   1. SolfallLauncher_X.Y.Z_x64-setup.exe      (asset principal, lo que descarga el usuario)
#   2. SolfallLauncher_X.Y.Z_x64-setup.exe.sig  (técnico, auto-updater)
#   3. latest.json                              (técnico, auto-updater; su url apunta al .exe)
# `gh release create`/`upload` listan esos tres archivos explícitamente (no un glob). Tras subir, se
# comprueba que la lista de assets del release es exactamente esa; si falta o sobra algo, no se publica.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions), los gestiona sólo el equipo de Solfall/Engine:
#   TAURI_SIGNING_PRIVATE_KEY           clave privada del updater (minisign). Nunca se commitea.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  su contraseña.
#
# Flujo: tag vX.Y.Z -> comprobaciones -> build + firma -> latest.json con URLs releases/download/vX.Y.Z/...
#        -> release en DRAFT con los 3 assets + notas en inglés (--notes-file) -> verificación exacta ->
#        PUBLICAR (último paso, --latest).
# Mientras es draft, /releases/latest/ no lo ve, así que los launchers instalados no ven nada a medias.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      CONF: src-tauri/tauri.conf.json
      BUNDLE_DIR: src-tauri/target/release/bundle/nsis
      OUT_DIR: release-assets
      EXPECTED_ENDPOINT: https://github.com/CrystalFVPM-DEV/SOLFALL-Launcher-by-CrystalFVPM/releases/latest/download/latest.json
      DOWNLOAD_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar tag = versión de tauri.conf.json (y config de release)
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
          const c = JSON.parse(readFileSync(process.env.CONF, 'utf8'));
          const tag = process.env.TAG;
          if (!/^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(tag)) fail(`tag "${tag}" no es vX.Y.Z`);
          if (tag !== `v${c.version}`) fail(`tag ${tag} no coincide con version "${c.version}" de ${process.env.CONF} (la versión la decide Engine; no se reescribe)`);
          if (c.productName !== 'SolfallLauncher') fail(`productName "${c.productName}" debe ser exactamente "SolfallLauncher" (el asset es SolfallLauncher_${c.version}_x64-setup.exe)`);
          const cua = c.bundle?.createUpdaterArtifacts;
          if (cua === 'v1Compatible') fail('bundle.createUpdaterArtifacts no puede ser "v1Compatible" (genera .nsis.zip); debe ser true');
          if (cua !== true) fail('bundle.createUpdaterArtifacts debe ser true (genera el .sig)');
          const up = c.plugins?.updater ?? {};
          if (!up.pubkey) fail('falta plugins.updater.pubkey');
          // Clave TEST-ONLY del PoC: jamás en un release público.
          if (up.pubkey.includes('dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEI4QUM4Q0Q3NUExMDAxRjUK')) fail('pubkey = clave TEST-ONLY; usar la de producción');
          const EXPECTED_KEY_ID = 'D78F00A86CB044C7';
          let pubText;
          try { pubText = Buffer.from(String(up.pubkey).trim(), 'base64').toString('utf8'); }
          catch { fail('plugins.updater.pubkey no es base64 válido'); }
          if (!pubText.startsWith('untrusted comment:')) fail('plugins.updater.pubkey: formato minisign inesperado (base64 -> texto)');
          const pubLines = pubText.split(/\r?\n/).filter(Boolean);
          const commentId = (pubLines[0].match(/minisign public key:\s*([0-9A-Fa-f]{16})/i) || [])[1]?.toUpperCase();
          if (!commentId) fail('plugins.updater.pubkey: la línea de comentario no contiene el key ID');
          let raw;
          try { raw = Buffer.from(pubLines[1], 'base64'); }
          catch { fail('plugins.updater.pubkey: la línea de la clave no es base64 válido'); }
          if (raw.length < 10 || raw.subarray(0, 2).toString() !== 'Ed') fail('plugins.updater.pubkey: los bytes de la clave no empiezan por Ed');
          // El key ID del comentario es el de 8 bytes tras 'Ed' interpretado little-endian (hex en mayúsculas).
          const idFromBytes = Buffer.from(raw.subarray(2, 10)).reverse().toString('hex').toUpperCase();
          if (commentId !== idFromBytes) fail(`plugins.updater.pubkey: key ID del comentario (${commentId}) != ID little-endian tras Ed (${idFromBytes})`);
          if (commentId !== EXPECTED_KEY_ID) fail(`plugins.updater.pubkey: key ID ${commentId} != ${EXPECTED_KEY_ID} (producción)`);
          if (!(up.endpoints ?? []).includes(process.env.EXPECTED_ENDPOINT)) fail(`plugins.updater.endpoints no incluye ${process.env.EXPECTED_ENDPOINT}`);
          if (up.dangerousInsecureTransportProtocol) fail('dangerousInsecureTransportProtocol no puede ir en un release');
          console.log(`OK ${tag} = ${c.productName} ${c.version} pubkey=${commentId}`);
          JS

      - name: Comprobar secrets de firma
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then echo "::error::falta el secret TAURI_SIGNING_PRIVATE_KEY"; exit 1; fi

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Caché de Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Dependencias (npm ci)
        run: npm ci

      # OPCIONAL: firma Authenticode del .exe (SmartScreen). Independiente de la firma del updater.
      # Se haría con bundle.windows.signCommand en un overlay (`--config src-tauri/tauri.sign.conf.json`), p. ej. Azure
      # Artifact Signing (añadir `id-token: write` a permissions + azure/login fijado por SHA) o la herramienta HSM del
      # proveedor del certificado OV/EV. Ver backend/signing/README.md de la propuesta.
      # - name: Overlay de firma Authenticode
      #   run: |
      #     printf '%s' '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_SIGNING_PROFILE }} %1"}}}' > src-tauri/tauri.sign.conf.json

      - name: Build + firma del updater (npx tauri build --bundles nsis)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Generar latest.json (URLs releases/download/<tag>/...)
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node --input-type=module <<'JS'
          import { readFileSync, copyFileSync, writeFileSync, existsSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const { CONF, TAG, BUNDLE_DIR, OUT_DIR, DOWNLOAD_BASE } = process.env;
          const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
          const c = JSON.parse(readFileSync(CONF, 'utf8'));
          if (c.productName !== 'SolfallLauncher') fail(`productName "${c.productName}" debe ser exactamente "SolfallLauncher"`);
          const exe = `SolfallLauncher_${c.version}_x64-setup.exe`;
          for (const f of [exe, `${exe}.sig`]) if (!existsSync(join(BUNDLE_DIR, f))) fail(`no existe ${join(BUNDLE_DIR, f)} (el instalador debe llamarse exactamente ${exe})`);
          const signature = readFileSync(join(BUNDLE_DIR, `${exe}.sig`), 'utf8').trim();
          if (!Buffer.from(signature, 'base64').toString('utf8').startsWith('untrusted comment:')) fail('.sig con formato inesperado');
          copyFileSync(join(BUNDLE_DIR, exe), join(OUT_DIR, exe));
          copyFileSync(join(BUNDLE_DIR, `${exe}.sig`), join(OUT_DIR, `${exe}.sig`));
          const entry = { signature, url: `${DOWNLOAD_BASE}/${encodeURIComponent(exe)}` };
          const latest = {
            version: c.version,
            notes: `Solfall Launcher ${c.version}`,
            pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
            platforms: { 'windows-x86_64-nsis': entry, 'windows-x86_64': entry },
          };
          writeFileSync(join(OUT_DIR, 'latest.json'), JSON.stringify(latest, null, 2) + '\n');
          const want = [exe, `${exe}.sig`, 'latest.json'].sort();
          const got = readdirSync(OUT_DIR).filter((n) => n !== '.' && n !== '..').sort();
          if (got.join('\n') !== want.join('\n')) fail(`OUT_DIR debe contener exactamente ${want.join(', ')}; hay: ${got.join(', ')}`);
          if (!entry.url.endsWith(exe) && !entry.url.endsWith(encodeURIComponent(exe))) fail(`latest.json url no apunta al .exe: ${entry.url}`);
          console.log(JSON.stringify(latest, null, 2));
          JS
          ls -la "$OUT_DIR"

      - name: Crear release en DRAFT con .exe + .sig + latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          EXE="SolfallLauncher_${VERSION}_x64-setup.exe"
          ASSET_EXE="$OUT_DIR/$EXE"
          ASSET_SIG="$OUT_DIR/$EXE.sig"
          ASSET_JSON="$OUT_DIR/latest.json"
          for f in "$ASSET_EXE" "$ASSET_SIG" "$ASSET_JSON"; do
            [ -f "$f" ] || { echo "::error::falta $f"; exit 1; }
          done
          extras=0
          for f in "$OUT_DIR"/*; do
            case "$(basename "$f")" in
              "$EXE"|"$EXE.sig"|latest.json) ;;
              *) echo "::error::archivo no permitido en $OUT_DIR: $(basename "$f")"; extras=1 ;;
            esac
          done
          [ "$extras" -eq 0 ] || exit 1
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes.md"
          cat > "$NOTES_FILE" <<'NOTES'
          This is an unofficial, community-made launcher. It is not affiliated with or endorsed by the Solfall team, unless they adopt it.

          Download only the .exe; .sig/latest.json are for the auto-updater.

          Solfall assets used with permission.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/isdraft 2>/dev/null; then
            if [ "$(cat /tmp/isdraft)" != "true" ]; then echo "::error::el release $TAG ya está publicado; no se toca"; exit 1; fi
            echo "draft existente (re-ejecución): se reemplazan los assets y se actualizan las notas"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Solfall Launcher $TAG" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" "$ASSET_EXE" "$ASSET_SIG" "$ASSET_JSON" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET_EXE" "$ASSET_SIG" "$ASSET_JSON" --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Solfall Launcher $TAG" --notes-file "$NOTES_FILE"
          fi

      - name: Verificar assets del draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          EXE="SolfallLauncher_${VERSION}_x64-setup.exe"
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | .[]')
          expected=$(printf '%s\n' "$EXE" "$EXE.sig" latest.json | LC_ALL=C sort)
          echo "$names"
          if [ "$names" != "$expected" ]; then
            echo "::error::los assets del release deben ser exactamente $EXE, $EXE.sig y latest.json (nada más: ni zips, ni README, ni .nsis.zip)"
            echo "hay: $names"
            exit 1
          fi

      - name: Publicar el release (último paso) y marcarlo como latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
